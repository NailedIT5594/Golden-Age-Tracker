<!doctype html>
<html lang="en">
<head>

  <title>Notes & To-Do List — The Golden Age</title>
  <link rel="stylesheet" href="app.css">

    <div class="art" id="art"></div>

      <div class="top">
        <button class="hamb" id="hamb">☰</button>

      </div>
      <main class="content" id="view"></main>
      <footer class="small">Local companion tracker. Progress stays in this browser. Locations and prerequisites can vary by mod version.</footer>
    </div>
  </div>
  <script src="bosses-data.js"></script>
  <script src="app.js"></script>
  <script src="rewards-data.js"></script>
